name: vsm_academy
description: "ВСМ Академия — геймифицированный тренажёр проводника ВСМ-400"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Локальное хранение профиля и истории прохождений.
  # Пока бэкенда нет, это единственный источник правды по прогрессу.
  shared_preferences: ^2.3.3
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/scenarios/
    - assets/data/
    - assets/logo.jpg
    - assets/logo_mark.png
